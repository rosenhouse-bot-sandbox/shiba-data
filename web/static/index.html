<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medicare Advantage plans</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/web/pdf_viewer.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>Medicare Advantage plans</h1>
    <nav>
      <a href="#/main" data-view="main">Main chart</a>
      <a href="#/dvha" data-view="dvha">Dental, vision, hearing &amp; extras</a>
      <a href="#/notes" data-view="notes">Notes</a>
      <a href="#/how" data-view="how">How it's made</a>
    </nav>
    <div id="meta">
      <a id="sheet-link" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 16 22" width="12" height="16" aria-hidden="true"><path d="M0 2a2 2 0 0 1 2-2h8l6 6v14a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2z" fill="#0f9d58"/><path d="M10 0l6 6h-4a2 2 0 0 1-2-2z" fill="#87ceac"/><path d="M3.5 9.5h9v8h-9zm1.2 1.2v1.4h2.7v-1.4zm3.9 0v1.4h2.7v-1.4zm-3.9 2.6v1.4h2.7v-1.4zm3.9 0v1.4h2.7v-1.4zm-3.9 2.6v.7h2.7v-.7zm3.9 0v.7h2.7v-.7z" fill="#fff" fill-rule="evenodd"/></svg>
        View in Google Sheets ↗
      </a>
      <span id="updated"></span>
    </div>
  </header>
  <div id="layout">
    <main id="content">Loading…</main>
    <aside id="viewer" hidden>
      <div class="toolbar">
        <strong id="doc-title"></strong>
        <button id="prev" title="Previous page">‹</button>
        <input id="page" type="number" min="1" aria-label="Page"> <span id="page-count"></span>
        <button id="next" title="Next page">›</button>
        <button id="find-open" title="Find in document (Ctrl+F)">Find</button>
        <a id="doc-source" target="_blank" rel="noopener">Carrier's copy ↗</a>
        <button id="close" title="Close">✕</button>
      </div>
      <div id="find" hidden>
        <input id="find-query" type="search" placeholder="Find in document" aria-label="Find in document">
        <span id="find-count"></span>
        <button id="find-prev" title="Previous match (Shift+Enter)">↑</button>
        <button id="find-next" title="Next match (Enter)">↓</button>
        <button id="find-close" title="Close (Esc)">✕</button>
      </div>
      <div id="source-note"></div>
      <div id="page-area"></div>
    </aside>
  </div>
</body>
</html>
