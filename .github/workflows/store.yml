name: Pack answers

# Packs the saved answers that git keeps or no locked pack holds, uploads the pack, and pushes a branch whose
# lock.json names it and whose git no longer keeps the answers.
on:
  workflow_dispatch:
    inputs:
      year:
        description: Plan year
        required: true
        default: "2027"

concurrency: pipeline

permissions:
  contents: write

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    environment: cloudflare
    runs-on: ubuntu-24.04
    env:
      YEAR: ${{ inputs.year }}
      # The token's bucket-scoped permission works through R2's S3 API, where its ID and hash are the key pair.
      AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_API_TOKEN_ID }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -I pipeline/store.py pull "$YEAR" _work
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          AWS_SECRET_ACCESS_KEY=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
          export AWS_SECRET_ACCESS_KEY
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          python3 -I pipeline/store.py pack "$YEAR" _work > _blobs.txt
          while read -r key path; do
            aws s3 cp "$path" "s3://pdxplans/$key" --only-show-errors < /dev/null
          done < _blobs.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="store/$YEAR-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          if [ -f "data/$YEAR/lock.json" ]; then git add "data/$YEAR/lock.json"; fi
          git rm -r -q --cached --ignore-unmatch "data/$YEAR/answers" "data/$YEAR/evaluations/*/answers"
          git commit -m "Keep the saved answers of $YEAR in R2 packs" || exit 0
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"
          echo "::notice::Pushed $branch. Open a pull request from it."
