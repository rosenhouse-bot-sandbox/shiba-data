name: Rereview

# Asks the pinned reviewer about trusted facts that have no saved review (pipeline/rereview.py).
on:
  workflow_dispatch:
    inputs:
      year:
        description: Plan year
        required: true
        default: "2027"
      limit:
        description: Most facts to ask about
        required: true
        default: "100"

concurrency: rereview

permissions:
  id-token: write
  contents: write

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    environment: cloudflare
    runs-on: ubuntu-24.04
    env:
      YEAR: ${{ inputs.year }}
      LIMIT: ${{ inputs.limit }}
      ANTHROPIC_ORGANIZATION_ID: 3c97a8fb-8968-4ed9-aec7-f68b88683532
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_0142UmsmTSG4RDAgtFvyHY9F
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_018f3jSg6eLJS1PxSPQQNxks
      ANTHROPIC_WORKSPACE_ID: wrkspc_014bRyT8dH9LwG9fPmLukPT9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pypdfium2==5.13.0 openpyxl==3.1.5 anthropic==2.3.0
      - run: npm ci
        working-directory: pipeline
      - name: Download the recorded PDF texts
        timeout-minutes: 20
        run: |
          python3 -I pipeline/blobs.py texts "data/$YEAR" _work > _texts.txt
          # shellcheck disable=SC2016 # sh -c expands $1 and $2.
          xargs -P 8 -n 2 sh -c 'mkdir -p "$(dirname "$2")" && curl -sSfL --retry 5 --retry-all-errors --max-time 300 -o "$2" "https://pdxplans.org/docs/$1.pdf"' _ \
            < _texts.txt
          sed 's/ /  /' _texts.txt | sha256sum -c --quiet
      - run: python3 -I pipeline/tables.py "$YEAR" "$RUNNER_TEMP/tables"
      - run: python3 -I pipeline/rereview.py "$YEAR" _work/texts _work "$LIMIT" api
        timeout-minutes: 300
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outcomes
          path: _work/rereview/outcomes.json
          if-no-files-found: ignore
      # Saved answers are worth keeping even when the run stops early.
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="rereview/$YEAR-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "data/$YEAR/answers"
          git commit -m "Save the reviewer answers of run $GITHUB_RUN_ID" || exit 0
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"
          echo "::notice::Pushed $branch."
