name: Pipeline

on:
  workflow_dispatch:
    inputs:
      year:
        description: Plan year to rebuild
        required: true
        default: "2027"
      candidate:
        description: Run these unpinned step versions, such as filled@2 or filled@2,document_facts@5, in place of their pins (pipeline/steps.py)
        required: false
      rebuild:
        description: Also rebuild the model steps from scratch into data/<year>/rebuilds/<this name> (issue #47)
        required: false

concurrency: pipeline

permissions:
  id-token: write
  contents: write

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    environment: cloudflare
    # A newer image can change pdftotext's layout text, and so every task's hash.
    runs-on: ubuntu-24.04
    env:
      YEAR: ${{ inputs.year }}
      REBUILD: ${{ inputs.rebuild }}
      CANDIDATE: ${{ inputs.candidate }}
      ANTHROPIC_ORGANIZATION_ID: 3c97a8fb-8968-4ed9-aec7-f68b88683532
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_0142UmsmTSG4RDAgtFvyHY9F
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_018f3jSg6eLJS1PxSPQQNxks
      ANTHROPIC_WORKSPACE_ID: wrkspc_014bRyT8dH9LwG9fPmLukPT9
      # The token's bucket-scoped permission works through R2's S3 API, where its ID and hash are the key pair.
      AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_API_TOKEN_ID }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install pypdfium2==5.13.0 openpyxl==3.1.5 anthropic==2.3.0
      - run: npm ci
        working-directory: pipeline
      # texts.py keeps these texts instead of extracting them again.
      - name: Download the recorded PDF texts
        timeout-minutes: 20
        run: |
          python3 -I pipeline/blobs.py texts "data/$YEAR" _work > _texts.txt
          while read -r digest path; do
            mkdir -p "$(dirname "$path")"
            curl -sSfL --retry 5 --retry-all-errors --max-time 300 -o "$path" "https://pdxplans.org/docs/$digest.pdf" < /dev/null
          done < _texts.txt
          if [ -s _texts.txt ]; then sed 's/ /  /' _texts.txt | sha256sum -c --quiet; fi
      # GitHub stops a job after 360 minutes, so these leave time to commit.
      # A rerun after a timeout reuses the results of the batches this run sent.
      - run: python3 -I pipeline/run.py "$YEAR" _work api "$CANDIDATE"
        timeout-minutes: ${{ inputs.rebuild != '' && inputs.candidate == '' && 120 || 290 }}
      # Upload before committing any data that names these blobs. Keys are content hashes, so a re-upload changes nothing.
      - id: upload
        if: always()
        timeout-minutes: 20
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          AWS_SECRET_ACCESS_KEY=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
          export AWS_SECRET_ACCESS_KEY
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          python3 -I pipeline/blobs.py upload "data/$YEAR" _work > _blobs.txt
          while read -r key path; do
            aws s3 cp "$path" "s3://pdxplans/$key" --only-show-errors < /dev/null
          done < _blobs.txt
      # A rebuild runs the pinned versions, so it skips a candidate run.
      - if: inputs.rebuild != '' && inputs.candidate == ''
        run: python3 -I pipeline/rebuild.py "$YEAR" _work "$REBUILD" api
        timeout-minutes: 210
      # Saved answers are worth keeping even when a later step stops the run.
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="pipeline/$YEAR-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # Without every blob, keep only the saved answers.
          if [ "${{ steps.upload.outcome }}" = success ]; then git add "data/$YEAR"; else git add "data/$YEAR/answers"; fi
          git commit -m "Rebuild $YEAR in run $GITHUB_RUN_ID${CANDIDATE:+ with $CANDIDATE}" || exit 0
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"
          echo "::notice::Pushed $branch. Open a pull request from it."
