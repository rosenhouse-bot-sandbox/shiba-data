name: Pipeline

on:
  workflow_dispatch:
    inputs:
      year:
        description: Plan year to rebuild
        required: true
        default: "2027"
      candidate:
        description: Run these unpinned step versions, such as present@8 or document_facts@16, in place of their pins (pipeline/steps.py)
        required: false

concurrency: pipeline

permissions:
  id-token: write
  contents: write

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    environment: cloudflare
    # A newer image can change pdftotext's layout text, and so every task's hash.
    runs-on: ubuntu-24.04
    env:
      YEAR: ${{ inputs.year }}
      CANDIDATE: ${{ inputs.candidate }}
      ANTHROPIC_ORGANIZATION_ID: 3c97a8fb-8968-4ed9-aec7-f68b88683532
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_0142UmsmTSG4RDAgtFvyHY9F
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_018f3jSg6eLJS1PxSPQQNxks
      ANTHROPIC_WORKSPACE_ID: wrkspc_014bRyT8dH9LwG9fPmLukPT9
      # The token's bucket-scoped permission works through R2's S3 API, where its ID and hash are the key pair.
      AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_API_TOKEN_ID }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install pypdfium2==5.13.0 openpyxl==3.1.5 anthropic==2.3.0
      - run: npm ci
        working-directory: pipeline
      # texts.py keeps these texts instead of extracting them again. A candidate run also keeps the PDFs and CMS zips
      # that earlier runs checked, so only its version changes the data.
      - name: Download the recorded inputs
        timeout-minutes: 20
        run: |
          recorded=texts
          if [ -n "$CANDIDATE" ]; then recorded=inputs; fi
          python3 -I pipeline/blobs.py "$recorded" "data/$YEAR" _work > _texts.txt
          while read -r digest path; do
            mkdir -p "$(dirname "$path")"
            curl -sSfL --retry 5 --retry-all-errors --max-time 300 -o "$path" "https://pdxplans.org/docs/$digest.pdf" < /dev/null
          done < _texts.txt
          if [ -s _texts.txt ]; then sed 's/ /  /' _texts.txt | sha256sum -c --quiet; fi
      # A document_facts candidate must change only its targets' plans. This check calls no API.
      - if: contains(env.CANDIDATE, 'document_facts@')
        run: python3 -I pipeline/tables.py "$YEAR" "$RUNNER_TEMP/tables"
        timeout-minutes: 15
      - id: blast
        if: contains(env.CANDIDATE, 'document_facts@')
        run: python3 -I pipeline/blast.py "$YEAR" _work "$CANDIDATE"
        timeout-minutes: 60
      # A stopped check can leave its stand-in outputs in data/<year>, which the later steps would commit.
      - if: always() && steps.blast.outcome != 'success' && steps.blast.outcome != 'skipped'
        run: git checkout -- "data/$YEAR" && git clean -fdqx -- "data/$YEAR"
      # run.py checks that the new texts still highlight the quotes of the pinned facts. A check above can leave the
      # candidate's facts, so this writes the pinned ones again.
      - run: python3 -I pipeline/tables.py "$YEAR" "$RUNNER_TEMP/tables"
        timeout-minutes: 15
      # GitHub stops a job after 360 minutes, so these leave time to commit.
      # A rerun after a timeout reuses the results of the batches this run sent.
      - run: python3 -I pipeline/run.py "$YEAR" _work api "$CANDIDATE"
        timeout-minutes: 290
      # A pin PR copies this table of changed cells from the run's summary.
      - run: python3 -I pipeline/changes.py "$YEAR" HEAD "$RUNNER_TEMP/tables" >> "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 15
        continue-on-error: true
      # Upload before committing any data that names these blobs. Keys are content hashes, so a re-upload changes nothing.
      # store.py packs the new saved answers and adds the pack to lock.json.
      - id: upload
        if: always()
        timeout-minutes: 20
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          AWS_SECRET_ACCESS_KEY=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
          export AWS_SECRET_ACCESS_KEY
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          python3 -I pipeline/blobs.py upload "data/$YEAR" _work > _blobs.txt
          python3 -I pipeline/store.py pack "$YEAR" _work >> _blobs.txt
          while read -r key path; do
            aws s3 cp "$path" "s3://pdxplans/$key" --only-show-errors < /dev/null
          done < _blobs.txt
      # Saved answers are worth keeping even when a later step stops the run.
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="pipeline/$YEAR-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # Without every blob, keep only the saved answers, in git.
          if [ "${{ steps.upload.outcome }}" = success ]; then
            git add "data/$YEAR"
            python3 -I pipeline/store.py untrack "$YEAR"
          else
            # The lock must not name a pack that R2 lacks.
            git checkout HEAD -- "data/$YEAR/lock.json" 2>/dev/null || rm -f "data/$YEAR/lock.json"
            # If the locked packs are unreadable, keep every saved answer.
            if python3 -I pipeline/store.py unpacked "$YEAR" _work > _unpacked.txt; then
              xargs -r git add -f -- < _unpacked.txt
            else
              git add -f "data/$YEAR/answers"
            fi
          fi
          git commit -m "Rebuild $YEAR in run $GITHUB_RUN_ID${CANDIDATE:+ with $CANDIDATE}" || exit 0
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"
          echo "::notice::Pushed $branch. Open a pull request from it."
