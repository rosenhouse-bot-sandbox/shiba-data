name: Documents

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Add documents.zip to this existing release instead of cutting a new one. Off main, upload the zip as a run artifact.
        required: false

concurrency: documents

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' || inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: inputs.tag == ''
        run: |
          python3 -I web/build.py documents _documents
          tar -cf documents.tar -C _documents .
      - if: inputs.tag != ''
        run: |
          gh release download "$TAG" --pattern documents.tar
          mkdir _documents
          tar -xf documents.tar -C _documents
      - run: |
          python3 -I web/build.py zip _documents documents.zip
          unzip -l documents.zip
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: documents.zip
          path: documents.zip
      - if: github.ref == 'refs/heads/main' && inputs.tag != ''
        run: gh release upload "$TAG" documents.zip --clobber
      - if: inputs.tag == ''
        run: |
          tag="documents-$(date -u +%Y-%m-%d-%H%M%S)"
          gh release create "$tag" documents.tar documents.zip --target "$GITHUB_SHA" --title "$tag" --notes "Plan documents from the carrier sites, listed in repro/data/documents.csv at ${{ github.sha }}."
          gh workflow run pages.yml --ref main
