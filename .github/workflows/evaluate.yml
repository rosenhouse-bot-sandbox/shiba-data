name: Evaluate

on:
  workflow_dispatch:
    inputs:
      year:
        description: Plan year
        required: true
        default: "2027"
      group:
        description: Benefit group
        type: choice
        options: [imaging]
      documents:
        description: Every document, or one per carrier and kind
        type: choice
        options: [sample, all]
      dollars:
        description: No role starts once the saved answers cost this much
        required: true
        default: "25"

concurrency: evaluate

permissions:
  id-token: write
  contents: write

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    environment: cloudflare
    runs-on: ubuntu-24.04
    env:
      YEAR: ${{ inputs.year }}
      GROUP: ${{ inputs.group }}
      DOCUMENTS: ${{ inputs.documents }}
      DOLLARS: ${{ inputs.dollars }}
      ANTHROPIC_ORGANIZATION_ID: 3c97a8fb-8968-4ed9-aec7-f68b88683532
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_0142UmsmTSG4RDAgtFvyHY9F
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_018f3jSg6eLJS1PxSPQQNxks
      ANTHROPIC_WORKSPACE_ID: wrkspc_014bRyT8dH9LwG9fPmLukPT9
      # The token's bucket-scoped permission works through R2's S3 API, where its ID and hash are the key pair.
      AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_API_TOKEN_ID }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pypdfium2==5.13.0 openpyxl==3.1.5 anthropic==2.3.0
      - run: npm ci
        working-directory: pipeline
      - name: Download the recorded PDF texts
        timeout-minutes: 20
        run: |
          python3 -I pipeline/blobs.py texts "data/$YEAR" _work > _texts.txt
          # shellcheck disable=SC2016 # sh -c expands $1 and $2.
          xargs -P 8 -n 2 sh -c 'mkdir -p "$(dirname "$2")" && curl -sSfL --retry 5 --retry-all-errors --max-time 300 -o "$2" "https://pdxplans.org/docs/$1.pdf"' _ \
            < _texts.txt
          sed 's/ /  /' _texts.txt | sha256sum -c --quiet
      - run: python3 -I pipeline/tables.py "$YEAR" "$RUNNER_TEMP/tables"
        timeout-minutes: 15
      - run: python3 -I pipeline/evaluate.py "$YEAR" _work/texts _eval "$GROUP" "$DOCUMENTS" "$DOLLARS" api
        timeout-minutes: 300
      # store.py packs the new saved answers and adds the pack to lock.json, which the branch then commits.
      - id: upload
        if: always()
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          AWS_SECRET_ACCESS_KEY=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
          export AWS_SECRET_ACCESS_KEY
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          python3 -I pipeline/store.py pack "$YEAR" "$RUNNER_TEMP/tables" > _blobs.txt
          while read -r key path; do
            aws s3 cp "$path" "s3://pdxplans/$key" --only-show-errors < /dev/null
          done < _blobs.txt
      # Saved answers are worth keeping even when the run stops early. Without the pack's upload, git keeps them.
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="evaluate/$YEAR-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          if [ "${{ steps.upload.outcome }}" = success ]; then
            git add "data/$YEAR/evaluations"
            if [ -f "data/$YEAR/lock.json" ]; then git add "data/$YEAR/lock.json"; fi
            python3 -I pipeline/store.py untrack "$YEAR"
          else
            git add "data/$YEAR/evaluations"
            # The lock must not name a pack that R2 lacks.
            git checkout HEAD -- "data/$YEAR/lock.json" 2>/dev/null || rm -f "data/$YEAR/lock.json"
            python3 -I pipeline/store.py unpacked "$YEAR" "$RUNNER_TEMP/tables" | xargs -r git add -f --
          fi
          git commit -m "Save the evaluation answers of run $GITHUB_RUN_ID" || exit 0
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"
          echo "::notice::Pushed $branch. Merge it so a rerun reuses its answers."
