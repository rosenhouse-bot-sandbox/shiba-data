name: Evaluate

on:
  workflow_dispatch:
    inputs:
      step:
        description: Evaluate models, or write document facts with the picked ones
        required: true
        default: evaluate
        type: choice
        options: [evaluate, facts]
      year:
        description: Plan year
        required: true
        default: "2027"
      group:
        description: Benefit group (evaluate only)
        type: choice
        options: [imaging]
      documents:
        description: Every document, or one per carrier and kind (evaluate only)
        type: choice
        options: [sample, all]
      dollars:
        description: No role starts once the saved answers cost this much
        required: true
        default: "25"

concurrency: evaluate

permissions:
  id-token: write
  contents: write

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      STEP: ${{ inputs.step }}
      YEAR: ${{ inputs.year }}
      GROUP: ${{ inputs.group }}
      DOCUMENTS: ${{ inputs.documents }}
      DOLLARS: ${{ inputs.dollars }}
      ANTHROPIC_ORGANIZATION_ID: 3c97a8fb-8968-4ed9-aec7-f68b88683532
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_0142UmsmTSG4RDAgtFvyHY9F
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_018f3jSg6eLJS1PxSPQQNxks
      ANTHROPIC_WORKSPACE_ID: wrkspc_014bRyT8dH9LwG9fPmLukPT9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pypdfium2==5.13.0 openpyxl==3.1.5 anthropic==2.3.0
      - run: npm ci
        working-directory: pipeline
      - name: Download the recorded PDF texts
        timeout-minutes: 20
        run: |
          python3 -I pipeline/blobs.py texts "data/$YEAR" _work > _texts.txt
          xargs -P 8 -n 2 sh -c 'mkdir -p "$(dirname "$2")" && curl -sSfL --retry 3 --max-time 300 -o "$2" "https://pdxplans.org/docs/$1.pdf"' _ \
            < _texts.txt
          sed 's/ /  /' _texts.txt | sha256sum -c --quiet
      - if: inputs.step == 'evaluate'
        run: python3 -I pipeline/evaluate.py "$YEAR" _work/texts _eval "$GROUP" "$DOCUMENTS" "$DOLLARS" api
        timeout-minutes: 300
      - if: inputs.step == 'facts'
        run: python3 -I pipeline/document_facts.py "$YEAR" _work api
        timeout-minutes: 120
      # Saved answers are worth keeping even when the run stops early.
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="$STEP/$YEAR-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          if [ "$STEP" = facts ]; then
            git add "data/$YEAR/answers" "data/$YEAR/machine/document_facts.csv"
          else
            git add "data/$YEAR/evaluations"
          fi
          git commit -m "Save the $STEP answers of run $GITHUB_RUN_ID" || exit 0
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"
          echo "::notice::Pushed $branch. Merge it so a rerun reuses its answers."
