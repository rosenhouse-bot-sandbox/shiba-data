name: Evaluate

on:
  workflow_dispatch:
    inputs:
      year:
        description: Plan year
        required: true
        default: "2027"
      group:
        description: Benefit group
        required: true
        default: imaging
      documents:
        description: all, or sample (one per carrier and kind)
        required: true
        default: sample

concurrency: pipeline

permissions:
  id-token: write
  contents: write

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      YEAR: ${{ inputs.year }}
      GROUP: ${{ inputs.group }}
      DOCUMENTS: ${{ inputs.documents }}
      ANTHROPIC_ORGANIZATION_ID: 3c97a8fb-8968-4ed9-aec7-f68b88683532
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_0142UmsmTSG4RDAgtFvyHY9F
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_018f3jSg6eLJS1PxSPQQNxks
      ANTHROPIC_WORKSPACE_ID: wrkspc_014bRyT8dH9LwG9fPmLukPT9
      AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_API_TOKEN_ID }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pypdfium2==5.13.0 openpyxl==3.1.5 anthropic==2.3.0
      - run: npm ci
        working-directory: pipeline
      - name: Download the recorded PDF texts
        timeout-minutes: 20
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          export AWS_SECRET_ACCESS_KEY=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          python3 -I pipeline/blobs.py texts "data/$YEAR" _work > _texts.txt
          xargs -P 8 -n 2 sh -c 'mkdir -p "$(dirname "$2")" && aws s3 cp "s3://pdxplans/blobs/$1" "$2" --only-show-errors' _ \
            < _texts.txt
          sed 's/ /  /' _texts.txt | sha256sum -c --quiet
      - run: python3 -I pipeline/evaluate.py "$YEAR" _work _eval "$GROUP" "$DOCUMENTS" api
        timeout-minutes: 300
      # Saved answers are worth keeping even when the run stops early.
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="evaluate/$YEAR-$GROUP-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "data/$YEAR/evaluations"
          git commit -m "Evaluate $GROUP readers and verifiers in run $GITHUB_RUN_ID" || exit 0
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"
          echo "::notice::Pushed $branch."
