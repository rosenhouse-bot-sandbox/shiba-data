name: Compare reviewers

# Compares other reviewer models with the pinned reviewer (pipeline/compare_reviewers.py).
on:
  workflow_dispatch:
    inputs:
      year:
        description: Plan year
        required: true
        default: "2027"
      accepts:
        description: Accepted review tasks to ask the other reviewer models, besides every rejected one
        required: true
        default: "300"

concurrency: compare-reviewers

permissions:
  id-token: write
  contents: write

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    environment: cloudflare
    runs-on: ubuntu-24.04
    env:
      YEAR: ${{ inputs.year }}
      ACCEPTS: ${{ inputs.accepts }}
      ANTHROPIC_ORGANIZATION_ID: 3c97a8fb-8968-4ed9-aec7-f68b88683532
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_0142UmsmTSG4RDAgtFvyHY9F
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_018f3jSg6eLJS1PxSPQQNxks
      ANTHROPIC_WORKSPACE_ID: wrkspc_014bRyT8dH9LwG9fPmLukPT9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pypdfium2==5.13.0 openpyxl==3.1.5 anthropic==2.3.0
      - run: npm ci
        working-directory: pipeline
      # tables.py downloads the texts and replays the pinned facts, with a ledger of each review task.
      - run: python3 -I pipeline/tables.py "$YEAR" "$RUNNER_TEMP/tables"
        timeout-minutes: 15
      - run: python3 -I pipeline/compare_reviewers.py "$YEAR" "$RUNNER_TEMP/tables" _work "$ACCEPTS" api
        timeout-minutes: 150
      - if: always()
        run: if [ -f _work/compare/report.md ]; then cat _work/compare/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdicts
          path: _work/compare/*/verdicts.json
          if-no-files-found: ignore
      # Saved answers are worth keeping even when the run stops early.
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="compare-reviewers/$YEAR-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "data/$YEAR/evaluations/reviewer"
          git commit -m "Save the reviewer answers of run $GITHUB_RUN_ID" || exit 0
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"
          echo "::notice::Pushed $branch."
