name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pipx run ruff==0.16.9 check
        working-directory: .
      - run: python3 -I -m unittest discover -b -s tests
      - run: python3 -I -m unittest discover -b -s ../pipeline/tests
      - run: node --test --test-reporter=dot tests/highlight.test.mjs tests/ago.test.mjs tests/permalink.test.mjs tests/worker.test.mjs tests/pipeline.test.mjs
      - run: python3 -I build.py site ../_site
      # The e2e tests open each PDF the site links. The public site serves every blob, so pull requests need no secret.
      - run: |
          mkdir ../_docs
          python3 -I build.py docs > ../_docs.txt
          xargs -P 8 -I{} curl -sSfL --retry 5 --retry-all-errors --max-time 300 -o "../_docs/{}.pdf" "https://pdxplans.org/docs/{}.pdf" < ../_docs.txt
          sed 's|.*|&  ../_docs/&.pdf|' ../_docs.txt | sha256sum -c --quiet
      - run: npm ci && npx playwright install --with-deps chromium
      - run: SITE=../_site DOCS=../_docs FAILURES=../_failures node --test --test-reporter=dot tests/e2e.test.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures
          path: _failures
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  # Reruns the pipeline from the committed run's blobs and saved answers, and fails on any change to tracked files.
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install pypdfium2==5.13.0 openpyxl==3.1.5
      - run: npm ci
        working-directory: pipeline
      - run: |
          mkdir _work
          python3 -I pipeline/blobs.py inputs "$(python3 -I pipeline/years.py)" _work > _work/inputs.txt
          # shellcheck disable=SC2016 # sh -c expands $1 and $2.
          xargs -P 8 -n 2 sh -c 'mkdir -p "$(dirname "$2")" && curl -sSfL --retry 5 --retry-all-errors --max-time 300 -o "$2" "https://pdxplans.org/docs/$1.pdf"' _ \
            < _work/inputs.txt
          sed 's/ /  /' _work/inputs.txt | sha256sum -c --quiet
      - run: python3 -I pipeline/run.py "$(basename "$(python3 -I pipeline/years.py)")" _work replay
      - run: |
          year=$(basename "$(python3 -I pipeline/years.py)")
          python3 -I pipeline/trace.py build "$year" "_work/trace/$year.sqlite" "$SHA" _work
          python3 -I pipeline/trace.py check "_work/trace/$year.sqlite"
          python3 -I pipeline/trace.py export "_work/trace/$year.sqlite" "_work/trace/$year"
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: trace
          path: _work/trace
      - uses: actions/upload-artifact@v4
        with:
          name: prompts
          path: _work/prompts
      - run: |
          git status --porcelain -- . ':(exclude)_work'
          test -z "$(git status --porcelain -- . ':(exclude)_work')"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, reproduce]
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          LOAD_TOKEN=$(printf 'pdxplans trace load %s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
          echo "::add-mask::$LOAD_TOKEN"
          echo "LOAD_TOKEN=$LOAD_TOKEN" >> "$GITHUB_ENV"
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.1"
          secrets: LOAD_TOKEN
          command: deploy --var COMMIT:${{ github.sha }}

  # R2 keeps each prompt the replay sent, so a trace can show it. Keys are content hashes, so sync adds only new ones.
  # R2 also keeps the latest main build's trace as trace/<year>.sqlite.
  # Each cell's trace goes to trace/<year>/cells/ by content hash, so sync uploads only cells that changed.
  # The Worker then loads into D1 the cells it lacks, a few per request, and adds the build.
  trace:
    if: github.ref == 'refs/heads/main'
    needs: [build, reproduce, deploy]
    runs-on: ubuntu-latest
    environment: cloudflare
    env:
      AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_API_TOKEN_ID }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prompts
          path: prompts
      - uses: actions/download-artifact@v4
        with:
          name: trace
          path: trace
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          AWS_SECRET_ACCESS_KEY=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
          export AWS_SECRET_ACCESS_KEY
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          aws s3 sync prompts s3://pdxplans/blobs/ --size-only --only-show-errors
          for db in trace/*.sqlite; do aws s3 cp "$db" "s3://pdxplans/$db" --only-show-errors; done
          LOAD_TOKEN=$(printf 'pdxplans trace load %s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
          echo "::add-mask::$LOAD_TOKEN"
          for manifest in trace/*/*.json; do
            year=$(basename "$(dirname "$manifest")")
            aws s3 sync "trace/$year/cells" "s3://pdxplans/trace/$year/cells/" --size-only --only-show-errors
            aws s3 cp "$manifest" "s3://pdxplans/$manifest" --only-show-errors
            url="https://pdxplans.org/trace/$year/load/$(jq -er .sha "$manifest")"
            for _ in $(seq 200); do
              status=$(curl -sS --max-time 60 --retry 3 -X POST -o response.txt -w "%{http_code}" \
                -H "Authorization: Bearer $LOAD_TOKEN" "$url")
              cat response.txt; echo
              [ "$status" = 409 ] || break
            done
            test "$status" = 200
          done

  sheet:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: google
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
      - env:
          SHEETS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 -I web/sheet_sync.py
