name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -I -m unittest discover -s tests
      - run: node --test tests/highlight.test.mjs
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir ../_documents
          if gh release download --pattern documents.tar --dir .. 2> ../gh.err; then
            tar -xf ../documents.tar -C ../_documents
          elif grep -q "release not found" ../gh.err; then
            echo "::warning::No documents release yet. Run the Documents workflow to cut one."
            python3 -I build.py documents ../_documents
          else
            cat ../gh.err
            exit 1
          fi
      - run: python3 -I build.py site ../_site ../_documents
      - run: npm ci && npx playwright install --with-deps chromium
      - run: SITE=../_site node --test tests/e2e.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
