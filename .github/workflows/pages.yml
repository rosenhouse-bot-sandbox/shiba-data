name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -I -m unittest discover -s tests
      - run: python3 -I -m unittest discover -s ../pipeline/tests
      - run: node --test tests/highlight.test.mjs tests/ago.test.mjs tests/worker.test.mjs
      - run: python3 -I build.py site ../_site
      # The e2e tests open each PDF the site links, from the R2 bucket the Worker serves.
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir ../_docs
          python3 -I build.py docs > ../_docs.txt
          npx --yes wrangler@4.156.1 --version
          xargs -P 8 -I{} npx wrangler@4.156.1 r2 object get "pdxplans/blobs/{}" --file "../_docs/{}.pdf" --remote < ../_docs.txt
          sed 's|.*|&  ../_docs/&.pdf|' ../_docs.txt | sha256sum -c --quiet
      - run: npm ci && npx playwright install --with-deps chromium
      - run: SITE=../_site DOCS=../_docs node --test tests/e2e.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.1"
          command: deploy

  sheet:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
      - env:
          SHEETS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 -I web/sheet_sync.py
