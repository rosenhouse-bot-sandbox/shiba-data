name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pipx run ruff==0.16.9 check
        working-directory: .
      - run: python3 -I -m unittest discover -s tests
      - run: python3 -I -m unittest discover -s ../pipeline/tests
      - run: node --test tests/highlight.test.mjs tests/ago.test.mjs tests/permalink.test.mjs tests/worker.test.mjs
      - run: python3 -I build.py site ../_site
      # The e2e tests open each PDF the site links. The public site serves every blob, so pull requests need no secret.
      - run: |
          mkdir ../_docs
          python3 -I build.py docs > ../_docs.txt
          xargs -P 8 -I{} curl -sSfL --retry 5 --retry-all-errors --max-time 300 -o "../_docs/{}.pdf" "https://pdxplans.org/docs/{}.pdf" < ../_docs.txt
          sed 's|.*|&  ../_docs/&.pdf|' ../_docs.txt | sha256sum -c --quiet
      - run: npm ci && npx playwright install --with-deps chromium
      - run: SITE=../_site DOCS=../_docs node --test tests/e2e.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  # Reruns the pipeline from the committed run's blobs and saved answers, and fails on any change to tracked files.
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install pypdfium2==5.13.0 openpyxl==3.1.5
      - run: npm ci
        working-directory: pipeline
      - run: |
          mkdir _work
          python3 -I pipeline/blobs.py inputs "$(python3 -I pipeline/years.py)" _work > _work/inputs.txt
          # shellcheck disable=SC2016 # sh -c expands $1 and $2.
          xargs -P 8 -n 2 sh -c 'mkdir -p "$(dirname "$2")" && curl -sSfL --retry 5 --retry-all-errors --max-time 300 -o "$2" "https://pdxplans.org/docs/$1.pdf"' _ \
            < _work/inputs.txt
          sed 's/ /  /' _work/inputs.txt | sha256sum -c --quiet
      - run: python3 -I pipeline/run.py "$(basename "$(python3 -I pipeline/years.py)")" _work replay
      - run: python3 -I pipeline/trace.py build "$(basename "$(python3 -I pipeline/years.py)")" _work/trace.sqlite "$SHA"
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: trace
          path: _work/trace.sqlite
      - run: |
          git status --porcelain -- . ':(exclude)_work'
          test -z "$(git status --porcelain -- . ':(exclude)_work')"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, reproduce]
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.1"
          command: deploy

  sheet:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: google
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
      - env:
          SHEETS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 -I web/sheet_sync.py
