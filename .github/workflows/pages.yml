name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -I -m unittest discover -s tests
      - run: python3 -I -m unittest discover -s ../pipeline/tests
      - run: node --test tests/highlight.test.mjs tests/ago.test.mjs tests/permalink.test.mjs tests/worker.test.mjs
      - run: python3 -I build.py site ../_site
      # The e2e tests open each PDF the site links, from the R2 bucket the Worker serves.
      # The token's bucket-scoped permission works through R2's S3 API, where its ID and hash are the key pair.
      - env:
          AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          export AWS_SECRET_ACCESS_KEY=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          mkdir ../_docs
          python3 -I build.py docs > ../_docs.txt
          xargs -P 8 -I{} aws s3 cp "s3://pdxplans/blobs/{}" "../_docs/{}.pdf" --only-show-errors < ../_docs.txt
          sed 's|.*|&  ../_docs/&.pdf|' ../_docs.txt | sha256sum -c --quiet
      - run: npm ci && npx playwright install --with-deps chromium
      - run: SITE=../_site DOCS=../_docs node --test tests/e2e.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  # Reruns the pipeline from the committed run's blobs and saved answers, and fails on any change to tracked files.
  reproduce:
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_API_TOKEN_ID }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install pypdfium2==5.13.0 openpyxl==3.1.5
      - run: npm ci
        working-directory: pipeline
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          export AWS_SECRET_ACCESS_KEY=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          mkdir _work
          python3 -I pipeline/blobs.py inputs "$(python3 -I pipeline/years.py)" _work > _work/inputs.txt
          xargs -P 8 -n 2 sh -c 'mkdir -p "$(dirname "$2")" && aws s3 cp "s3://pdxplans/blobs/$1" "$2" --only-show-errors' _ \
            < _work/inputs.txt
          sed 's/ /  /' _work/inputs.txt | sha256sum -c --quiet
      - run: python3 -I pipeline/run.py "$(basename "$(python3 -I pipeline/years.py)")" _work replay
      - run: |
          git status --porcelain -- . ':!_work'
          test -z "$(git status --porcelain -- . ':!_work')"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, reproduce]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.1"
          command: deploy

  sheet:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
      - env:
          SHEETS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 -I web/sheet_sync.py
