name = "pdxplans"
main = "web/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "pdxplans.org", custom_domain = true },
  { pattern = "www.pdxplans.org", custom_domain = true },
]

[assets]
directory = "_site"
binding = "ASSETS"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "pdxplans"

# Each main build's cell traces, loaded through this binding by web/worker.js.
[[d1_databases]]
binding = "TRACE"
database_name = "pdxplans-2027"
database_id = "9ce1bcb4-070e-4488-befc-762ea371b4f5"
